# Weekly, grouped so each ecosystem opens at most one PR a week.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /site
    schedule: {interval: weekly}
    groups: {site: {patterns: ["*"]}}
  - package-ecosystem: cargo
    directory: /native/legato-step
    schedule: {interval: weekly}
    groups: {native: {patterns: ["*"]}}
