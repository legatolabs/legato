# Publish to PyPI when a version tag (v*) is pushed, or from Actions -> release -> Run workflow with the version
# (then the workflow creates the v<version> tag itself after publishing). Uses PyPI Trusted Publishing: no token is
# stored anywhere. After PyPI it lists the MCP server on the MCP Registry (server.json).
# One-time setup on pypi.org -> Your account -> Publishing -> Add a new pending publisher:
#   PyPI project name: legatolabs · Owner: legatolabs · Repository: legato · Workflow: release.yml · Environment: pypi
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal the version in pyproject.toml), e.g. 0.1.0"
        required: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: The tag or requested version matches the package version
        env:
          WANT: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$WANT" || { echo "requested $WANT != version $v in pyproject.toml"; exit 1; }
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  tag:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
  mcp-registry:
    # Lists the MCP server (server.json) on registry.modelcontextprotocol.io as io.github.legatolabs/legato.
    # GitHub OIDC proves the repo owner; the registry checks the `mcp-name:` line in the README on PyPI.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: server.json matches the package version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python3 -c "import json,sys; d=json.load(open('server.json')); sys.exit(0 if d['version']==d['packages'][0]['version']=='$v' else 1)" \
            || { echo "server.json version != $v"; exit 1; }
          for i in $(seq 30); do curl -fsS -o /dev/null "https://pypi.org/pypi/legatolabs/$v/json" && exit 0; sleep 10; done
          echo "legatolabs $v is not on PyPI yet"; exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
