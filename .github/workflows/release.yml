# Publish to PyPI when a version tag (v*) is pushed, or from Actions -> release -> Run workflow with the version
# (then the workflow creates the v<version> tag itself after publishing). Uses PyPI Trusted Publishing: no token is
# stored anywhere.
# One-time setup on pypi.org -> Your account -> Publishing -> Add a new pending publisher:
#   PyPI project name: legatolabs · Owner: legatolabs · Repository: legato · Workflow: release.yml · Environment: pypi
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal the version in pyproject.toml), e.g. 0.1.0"
        required: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: The tag or requested version matches the package version
        env:
          WANT: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$WANT" || { echo "requested $WANT != version $v in pyproject.toml"; exit 1; }
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  tag:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
