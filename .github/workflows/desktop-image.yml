# Publish the desktop image (docker/desktop) to ghcr.io/legatolabs/desktop, for `--sandbox docker`.
name: desktop-image
on:
  push:
    branches: [main]
    paths: ["docker/desktop/**", ".github/workflows/desktop-image.yml"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/desktop
          push: true
          tags: ghcr.io/legatolabs/desktop:latest,ghcr.io/legatolabs/desktop:${{ github.sha }}
