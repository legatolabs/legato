name: local-desktop
on: workflow_dispatch
permissions:
  contents: read
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1646bf7f916d64ec8220c7d3fe3e84433a43dd1b
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mousepad python3-pyatspi at-spi2-core dbus-x11 openbox xdotool
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' env NO_AT_BRIDGE=0 GTK_MODULES=gail:atk-bridge sh -c 'openbox >/tmp/legato-editor-wm.log 2>&1 & exec python tests/desktop/document_receipt.py'
      - if: runner.os != 'Linux'
        run: python tests/desktop/document_receipt.py
