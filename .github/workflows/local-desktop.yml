name: local-desktop
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of native runner labels
        default: '["ubuntu-24.04","macos-15","windows-2022"]'
        required: true
permissions:
  contents: read
jobs:
  ledger:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1646bf7f916d64ec8220c7d3fe3e84433a43dd1b
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: 1b436a5b117ad0ae0d2af9dfdd4e7e617cf506dc
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./candidate
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python tests/desktop/overall_runner.py --shard ${{ matrix.shard }}
      - if: runner.os != 'Linux'
        run: python tests/desktop/overall_runner.py --shard ${{ matrix.shard }}
