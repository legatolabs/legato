name: local-desktop
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ledger:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1646bf7f916d64ec8220c7d3fe3e84433a43dd1b
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: 1b436a5b117ad0ae0d2af9dfdd4e7e617cf506dc
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./candidate
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python tests/desktop/long_ledger.py --shard ${{ matrix.shard }}
      - if: runner.os != 'Linux'
        run: python tests/desktop/long_ledger.py --shard ${{ matrix.shard }}
