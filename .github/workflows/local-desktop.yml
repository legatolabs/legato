name: local-desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python tests/desktop/verified_readiness.py results.json
      - if: runner.os != 'Linux'
        run: python tests/desktop/verified_readiness.py results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-${{ matrix.os }}
          path: results.json
