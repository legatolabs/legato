name: local-desktop
on: workflow_dispatch
permissions:
  contents: read
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1646bf7f916d64ec8220c7d3fe3e84433a43dd1b
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python tests/desktop/document_receipt.py --late-state
