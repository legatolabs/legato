[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legatolabs"
version = "0.3.0"
description = "A fast, open-source computer-use agent for any model: your Mac in the background, your screen, any sandbox, or your coding agent (MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Legato authors"}]
keywords = ["computer-use", "computer use agent", "gui agent", "desktop agent", "desktop automation", "mcp", "mcp server",
            "claude code", "cursor", "osworld", "qwen", "openrouter", "vllm", "local llm", "e2b", "docker", "sandbox",
            "llm agents", "reinforcement learning", "rollouts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment",
]
# One install has everything for your own computer and your coding agents: the screen and input (mss, pyautogui),
# the MCP server, and on macOS background mode (ApplicationServices) and the text reader plans use (Vision).
dependencies = ["httpx>=0.27", "Pillow>=10", "mcp>=1.2", "mss>=9", "pyautogui>=0.9.54", "pyperclip>=1.8",
                "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
                "pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]

[project.optional-dependencies]
e2b = ["e2b-desktop>=2.7"]
office = ["python-pptx>=1.0", "openpyxl>=3.1"]
mcp = []      # in the base install since 0.3.0; kept so `pip install "legatolabs[mcp]"` still works
local = []    # the same
video = ["imageio>=2.30", "imageio-ffmpeg>=0.5", "numpy"]
dev = ["pytest>=8", "mcp>=1.2", "python-pptx>=1.0", "openpyxl>=3.1", "imageio>=2.30", "imageio-ffmpeg>=0.5", "numpy"]

[project.scripts]
legato = "legato.__main__:main"
legatolabs = "legato.__main__:main"   # so `uvx legatolabs ...` works

[project.urls]
Homepage = "https://legato.computer"
Documentation = "https://legato.computer/docs"
Benchmarks = "https://legato.computer/docs/benchmarks"
Source = "https://github.com/legatolabs/legato"
Issues = "https://github.com/legatolabs/legato/issues"
Changelog = "https://github.com/legatolabs/legato/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["legato*"]

[tool.setuptools.package-data]
legato = ["py.typed", "bin/legato-step-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
